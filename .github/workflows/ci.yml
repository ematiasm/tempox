name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately. With one, a PR whose base is another
  # branch runs **no CI at all** — GitHub discards the event before any job is
  # considered, and the PR shows `no checks reported`. That is every PR in a
  # chain, which is how this repository works when a change is too large for one
  # review slice.
  #
  # Measured on #75: while it targeted #74's branch, no run existed. Retargeting
  # it to `main` did not start one either — GitHub emits `pull_request` on
  # `opened`, `synchronize` and `reopened`, and a base change is `edited`. Closing
  # and reopening produced a run immediately. Two manual steps per stacked PR,
  # and none of them a guarantee: until they happen, the code has no CI at all.
  #
  # The cost of removing the filter is that a PR against a scratch branch also
  # runs. That is the cheaper side of the trade.
  #
  # `types:` is spelled out rather than left empty: a bare `pull_request:` means
  # all of them and parses to `null`, which reads like a mistake. These are the
  # defaults, kept visible so nobody has to know that.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # A real PostgreSQL for the job. The `sqlx::query!` macros verify the SQL
    # against a live database at compile time, so this service is not optional:
    # without it the crate cannot be compiled or tested.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tempox
          POSTGRES_PASSWORD: tempox
          POSTGRES_DB: tempox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempox -d tempox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The job's own schema database: `sqlx migrate run` and `cargo sqlx prepare
      # --check` need one, and the compiled query cache is checked against it.
      DATABASE_URL: postgres://tempox:tempox@localhost:5432/tempox
      # What the TESTS use. `#[sqlx::test]` creates and drops a database per test
      # from this URL (`sqlx-postgres` reads `DATABASE_URL`, so the integration step
      # overrides it below with this value). Keeping the two names distinct is what
      # stops a test from ever writing to the development database.
      TEST_DATABASE_URL: postgres://tempox:tempox@localhost:5432/tempox_test
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      # The migrations must run BEFORE anything compiles, clippy included: it
      # builds the crate, and every handler uses sqlx's macros, which query
      # this database while expanding. A different applier is not an option
      # either: `sqlx::migrate!` in the binary reads `_sqlx_migrations`, so a
      # raw `psql` loop would leave that table empty and make the app
      # re-execute every migration on boot. One migrator, one source of truth.
      - name: Cache sqlx-cli
        id: sqlx-cli-cache
        # v5 runs on Node 24; v4 still declares Node 20, which the runners
        # only keep alive by forcing it onto Node 24.
        uses: actions/cache@v6
        with:
          # `cargo install sqlx-cli` installs two binaries: `sqlx`, the CLI
          # itself, and `cargo-sqlx`, which is what makes `cargo sqlx` a valid
          # subcommand. Caching only `sqlx` meant a cache hit skipped the
          # install below while leaving `cargo-sqlx` absent, so the `prepare`
          # check failed with "no such command: `sqlx`". Both belong in the
          # archive. Editing `path` also rotates the cache version, so the
          # stale entry cannot be matched again.
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.9-${{ runner.os }}
      # sqlx-cli publishes no prebuilt binaries, so this compiles (~30s). The
      # version tracks the `sqlx` crate, and the `.sqlx` cache format does not
      # carry across generations: a 0.9 crate refuses the files a 0.8
      # `prepare` recorded (`prepare check failed: one or more query files
      # differ`), so the two move together.
      - name: Install sqlx-cli
        if: steps.sqlx-cli-cache.outputs.cache-hit != 'true'
        # --force: a miss here does not guarantee `~/.cargo/bin` is empty.
        # `Swatinem/rust-cache` above caches the whole bin directory, so an
        # archive saved while the entry below still matched puts `sqlx` back,
        # and a plain install stops with "binary `sqlx` already exists in
        # destination". Overwriting is what we want: the version is pinned.
        run: >-
          cargo install sqlx-cli --version ^0.9 --locked --force
          --no-default-features --features rustls,postgres
      - name: Apply migrations
        run: |
          sqlx migrate run --source migrations
          sqlx migrate info --source migrations
      # `#[sqlx::test]` connects to `TEST_DATABASE_URL` to create one database per
      # test. That master database has to exist, and the service container starts
      # with only the development one — creating it is this step's job, the same way
      # `make test-db` does it locally. Without this the integration step fails to
      # connect before any test runs.
      - name: Create the test database
        env:
          PGPASSWORD: tempox
        run: >-
          psql -h localhost -U tempox -d postgres
          -c 'CREATE DATABASE tempox_test'
      # `.sqlx/` is what lets the crate compile with no database at all, which is
      # how `make build` and `make lint` work on a laptop and how the image builds
      # without reaching this job's Postgres. Compiling against a stale cache
      # fails later on a type that no longer matches, in a place that names the
      # query rather than the cause. This check turns that into a clear error at
      # the step whose job it is; SQLX_OFFLINE=false opts back into the database
      # this job already has.
      - name: Verify the sqlx offline cache is current
        run: SQLX_OFFLINE=false cargo sqlx prepare --check -- --all-targets
      # --locked everywhere: Cargo.lock is tracked, so the build must use the
      # versions it pins instead of silently re-resolving them. A stale lock
      # fails the build loudly rather than shipping an untested combination.
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Unit tests plus the full build of the binary used below.
      - run: cargo build --locked --all-features
      - run: cargo test --locked --all-features
      # No separately started server and no thread limit. Every test creates its own
      # database via `#[sqlx::test]`, and the tests that need a real socket start
      # `CARGO_BIN_EXE_tempox` themselves on an ephemeral port — the step above
      # already built it. Nothing is shared, so nothing has to be serialized.
      - name: Integration tests
        # `DATABASE_URL` is set to the TEST database for this step only. It is what
        # `#[sqlx::test]` reads, and inheriting the job's development URL would
        # create the per-test databases through it.
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: cargo test --locked --all-features --test integration -- --include-ignored

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run build

  # The frontend image is the only artifact in this repository that CI never
  # built (#23). Its two defects were both invisible from the outside -- the
  # lockfile never entered the build, and `COPY . .` overwrote the installed
  # tree -- and neither could be caught by any job here.
  #
  # What this job actually proves, stated precisely so its green means what it
  # looks like it means: the image builds from the committed lockfile alone, and
  # every package it installs is one the lock pins. `npm ci` is load-bearing for
  # that -- it fails with EUSAGE when the manifest and the lock disagree, which
  # nothing else in this pipeline checks, because the npm jobs above run
  # `npm install` and will quietly re-resolve instead.
  #
  # What it cannot prove: the overwrite defect. A CI checkout has no
  # `node_modules` (it is gitignored), so the context is already clean and
  # `COPY . .` has nothing to clobber. That half of #23 is covered by
  # `frontend/.dockerignore` plus the sentinel test recorded in the PR, not by
  # this job. Saying so beats implying a guarantee the job does not give.
  #
  # No registry cache is configured on purpose: `npm ci` is the check, and a
  # stale cache is one more thing that could make it pass for the wrong reason.
  image:
    name: Frontend image (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the frontend image
        run: docker build --tag tempox-frontend:ci --file frontend/Dockerfile frontend
      # The build succeeds if the layers resolve; this asserts the result is
      # actually usable, so a broken image cannot ride on a green build.
      - name: The image serves the app
        run: |
          # `BACKEND_URL` is a runtime value the proxy reads per request. The job
          # does not need a live backend to prove the image serves: `/sales` is
          # server-rendered, and a missing backend only fails the `/api` calls the
          # browser makes afterwards.
          docker run --rm --detach --name tempox-frontend-ci --publish 4173:5173 \
            --env BACKEND_URL=http://backend-not-reachable:3001 \
            tempox-frontend:ci
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4173/sales >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::the image did not serve /sales in 60s"
            docker logs tempox-frontend-ci
            docker stop tempox-frontend-ci || true
            exit 1
          fi
          # `/` redirects to `/sales` through the app's own +page.ts, so this
          # also proves routing survived the build.
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/)"
          echo "GET / -> $status"
          test "$status" = "307"

          # The image must NOT ship the sources it was built from. Before the
          # two-stage Dockerfile this served `src/lib/*.ts` with a 200, because
          # `vite dev` compiled on the fly. A 200 here is the regression.
          src_status="$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:4173/src/lib/api.ts)"
          echo "GET /src/lib/api.ts -> $src_status"
          docker stop tempox-frontend-ci || true
          if [ "$src_status" != "404" ]; then
            echo "::error::the image served its own source ($src_status); it is a dev image"
            exit 1
          fi

      # S6: the runtime stage carries `build/` and Node, nothing else. Asserted
      # rather than assumed, because "it serves" and "it ships no toolchain" are
      # different claims and only the first one is visible from a browser.
      - name: The image ships no development tree
        run: |
          for absent in src tests node_modules playwright.config.ts; do
            if docker run --rm --entrypoint sh tempox-frontend:ci -c "test -e /app/$absent"; then
              echo "::error::/app/$absent is present in the runtime image"
              exit 1
            fi
            echo "/app/$absent absent, as intended"
          done

  # The sale flow against a real database and a real API (S14). This is the
  # stamp's regression barrier: the stamp is the one piece of the direction no
  # unit test can see, so it needs a browser driving the real screen.
  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tempox
          POSTGRES_PASSWORD: tempox
          POSTGRES_DB: tempox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempox -d tempox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tempox:tempox@localhost:5432/tempox
      # What the backend Playwright starts actually uses, and what the run must
      # never point at: the development database's ledger is append-only.
      TEST_DATABASE_URL: postgres://tempox:tempox@localhost:5432/tempox_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # The migrations must run before anything compiles: every handler uses
      # sqlx's macros, which query the database while expanding.
      - name: Cache sqlx-cli
        id: sqlx-cli-cache
        # Node 24, same as the backend job.
        uses: actions/cache@v6
        with:
          # Both binaries, same as the backend job: the key is shared, so an
          # archive saved here without `cargo-sqlx` would break that job's
          # `cargo sqlx prepare` check the moment it matched.
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.9-${{ runner.os }}
      - name: Install sqlx-cli
        if: steps.sqlx-cli-cache.outputs.cache-hit != 'true'
        # --force, same as the backend job: rust-cache can restore `sqlx`
        # without the sqlx-cli entry matching, and a plain install then fails
        # with "binary `sqlx` already exists in destination". Version matches
        # the backend job so the shared cache key holds one generation.
        run: >-
          cargo install sqlx-cli --version ^0.9 --locked --force
          --no-default-features --features rustls,postgres
      - name: Apply migrations
        working-directory: backend
        run: sqlx migrate run --source migrations
      - name: Create the test database
        env:
          PGPASSWORD: tempox
        run: >-
          psql -h localhost -U tempox -d postgres
          -c 'CREATE DATABASE tempox_test'

      # The binary Playwright's `webServer` will start. Building it here, and not
      # inside the Playwright command, keeps a compile error reading as a compile
      # error rather than as "webServer failed to start".
      - name: Build the backend binary
        working-directory: backend
        run: cargo build --locked --all-features

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
        working-directory: frontend

      # Playwright's browsers are a machine-level artifact, not a repo one, so a
      # runner always needs them installed: without this the run fails with
      # "Executable doesn't exist" rather than with a product defect.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` starts BOTH servers: the backend on :3099 and the
      # preview on 4173, with no separate dev-server step. It also hands the
      # preview its `BACKEND_URL`, which the app's `/api` proxy reads per request,
      # so this step no longer sets an API origin of its own.
      - name: Run the sale flow
        working-directory: frontend
        run: npx playwright test

      # v6, not v5: v5 does not move this action off Node 20.
      # `test-results`, not `playwright-report`: this config declares no
      # `reporter`, so Playwright's default (`dot` under CI) applies and only
      # `test-results` is written -- `playwright-report` is produced by the
      # `html` reporter alone, which nothing here enables. The old path
      # therefore matched no file at all, and the step uploaded nothing while
      # still reporting success: "No files were found with the provided path".
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
