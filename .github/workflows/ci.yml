name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # A real PostgreSQL for the job. The `sqlx::query!` macros verify the SQL
    # against a live database at compile time, so this service is not optional:
    # without it the crate cannot be compiled or tested.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tempox
          POSTGRES_PASSWORD: tempox
          POSTGRES_DB: tempox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempox -d tempox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tempox:tempox@localhost:5432/tempox
      # Surfaced to the integration tests, which spawn nothing of their own.
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The migrations must be applied by sqlx itself, never by a raw `psql`
      # loop: `sqlx::migrate!` in the binary reads `_sqlx_migrations`, so a
      # different applier would leave that table empty and make the app
      # re-execute every migration on boot. One migrator, one source of truth.
      - name: Cache sqlx-cli
        id: sqlx-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-0.8-${{ runner.os }}
      # sqlx-cli publishes no prebuilt binaries, so this compiles (~30s). The
      # version tracks the `sqlx` crate, which must stay the same generation:
      # the recorded migration checksums are generation-specific.
      - name: Install sqlx-cli
        if: steps.sqlx-cli-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install sqlx-cli --version ^0.8 --locked
          --no-default-features --features rustls,postgres
      # The schema has to exist BEFORE cargo compiles anything: the macros
      # expand during the build and query this database.
      - name: Apply migrations
        run: |
          sqlx migrate run --source migrations
          sqlx migrate info --source migrations
      # Unit tests plus the full build of the binary used below.
      - run: cargo build --all-features
      - run: cargo test --all-features
      # The ignored tests drive the real HTTP API, so the server runs here.
      # They are serialized on purpose: several of them read a global cash
      # total before and after their own sale, which another test executing
      # concurrently would perturb.
      - name: Integration tests (live server)
        run: |
          ./target/debug/tempox > /tmp/backend.log 2>&1 &
          server_pid=$!
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::backend did not become healthy in 60s"
            cat /tmp/backend.log
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi
          cargo test --all-features -- --ignored --test-threads=1
          status=$?
          kill "$server_pid" 2>/dev/null || true
          echo "--- backend log ---"
          cat /tmp/backend.log
          exit $status

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run build
