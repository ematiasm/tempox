name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # A real PostgreSQL for the job. The `sqlx::query!` macros verify the SQL
    # against a live database at compile time, so this service is not optional:
    # without it the crate cannot be compiled or tested.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tempox
          POSTGRES_PASSWORD: tempox
          POSTGRES_DB: tempox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempox -d tempox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tempox:tempox@localhost:5432/tempox
      # Surfaced to the integration tests, which spawn nothing of their own.
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      # The migrations must run BEFORE anything compiles, clippy included: it
      # builds the crate, and every handler uses sqlx's macros, which query
      # this database while expanding. A different applier is not an option
      # either: `sqlx::migrate!` in the binary reads `_sqlx_migrations`, so a
      # raw `psql` loop would leave that table empty and make the app
      # re-execute every migration on boot. One migrator, one source of truth.
      - name: Cache sqlx-cli
        id: sqlx-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-0.8-${{ runner.os }}
      # sqlx-cli publishes no prebuilt binaries, so this compiles (~30s). The
      # version tracks the `sqlx` crate, which must stay the same generation:
      # the recorded migration checksums are generation-specific.
      - name: Install sqlx-cli
        if: steps.sqlx-cli-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install sqlx-cli --version ^0.8 --locked
          --no-default-features --features rustls,postgres
      - name: Apply migrations
        run: |
          sqlx migrate run --source migrations
          sqlx migrate info --source migrations
      # `.sqlx/` is what lets the crate compile with no database at all, which is
      # how `make build` and `make lint` work on a laptop and how the image builds
      # without reaching this job's Postgres. Compiling against a stale cache
      # fails later on a type that no longer matches, in a place that names the
      # query rather than the cause. This check turns that into a clear error at
      # the step whose job it is; SQLX_OFFLINE=false opts back into the database
      # this job already has.
      - name: Verify the sqlx offline cache is current
        run: SQLX_OFFLINE=false cargo sqlx prepare --check -- --all-targets
      # --locked everywhere: Cargo.lock is tracked, so the build must use the
      # versions it pins instead of silently re-resolving them. A stale lock
      # fails the build loudly rather than shipping an untested combination.
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Unit tests plus the full build of the binary used below.
      - run: cargo build --locked --all-features
      - run: cargo test --locked --all-features
      # The ignored tests drive the real HTTP API, so the server runs here.
      # They are serialized on purpose: several of them read a global cash
      # total before and after their own sale, which another test executing
      # concurrently would perturb.
      - name: Integration tests (live server)
        run: |
          ./target/debug/tempox > /tmp/backend.log 2>&1 &
          server_pid=$!
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::backend did not become healthy in 60s"
            cat /tmp/backend.log
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi
          cargo test --locked --all-features -- --ignored --test-threads=1
          status=$?
          kill "$server_pid" 2>/dev/null || true
          echo "--- backend log ---"
          cat /tmp/backend.log
          exit $status

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run build

  # The sale flow against a real database and a real API (S14). This is the
  # stamp's regression barrier: the stamp is the one piece of the direction no
  # unit test can see, so it needs a browser driving the real screen.
  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tempox
          POSTGRES_PASSWORD: tempox
          POSTGRES_DB: tempox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempox -d tempox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tempox:tempox@localhost:5432/tempox
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # The migrations must run before anything compiles: every handler uses
      # sqlx's macros, which query the database while expanding.
      - name: Cache sqlx-cli
        id: sqlx-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-0.8-${{ runner.os }}
      - name: Install sqlx-cli
        if: steps.sqlx-cli-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install sqlx-cli --version ^0.8 --locked
          --no-default-features --features rustls,postgres
      - name: Apply migrations
        working-directory: backend
        run: sqlx migrate run --source migrations

      # The API has to be running: the tests drive the real screen, and the
      # screen talks to the real backend.
      - name: Build and start the backend
        working-directory: backend
        run: |
          cargo build --locked --all-features
          ./target/debug/tempox > /tmp/backend.log 2>&1 &
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::backend did not become healthy in 60s"
            cat /tmp/backend.log
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
        working-directory: frontend

      # Playwright's browsers are a machine-level artifact, not a repo one, so a
      # runner always needs them installed: without this the run fails with
      # "Executable doesn't exist" rather than with a product defect.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` starts the preview server itself on 4173, so no
      # separate dev-server step is needed here.
      - name: Run the sale flow
        working-directory: frontend
        env:
          PUBLIC_API_BASE: http://localhost:3001
        run: npx playwright test

      - name: Backend log
        if: always()
        run: cat /tmp/backend.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
