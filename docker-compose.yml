services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skilluv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skilluv}
      POSTGRES_DB: ${POSTGRES_DB:-skilluv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skilluv}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skilluv}:${POSTGRES_PASSWORD:-skilluv}@postgres:5432/${POSTGRES_DB:-skilluv}
      BACKEND_PORT: 3001
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # The same image as `backend`, on port 3002, pointed at a second database
  # (`tempox_test`) inside the same postgres container. The integration tests
  # record real sales, products and stock movements, and `stock_movements` is
  # append-only — so whatever they write is permanent and must not land in the
  # database the screens read.
  #
  # Port 3002 matters as much as the database name: seven of the eleven tests
  # drive the HTTP API rather than connecting directly, so pointing the tests at
  # a different database is not enough on its own — they also have to reach a
  # backend that is pointed at that database.
  #
  # The `test` profile keeps this out of `docker compose up` and `make dev`.
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tempox-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skilluv}:${POSTGRES_PASSWORD:-skilluv}@postgres:5432/${TEST_DB:-tempox_test}
      BACKEND_PORT: 3002
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
