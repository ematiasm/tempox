services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # These defaults are for a NEW volume. Docker only applies POSTGRES_* when
      # it initializes `pgdata`, so a volume created by an older checkout keeps
      # whatever role it was born with, and these values silently do nothing.
      #
      # They used to say `skilluv`, from the template this repository started as.
      # Changing them is not free: an existing volume has no `tempox` role, so the
      # backend's composed URL would reach a database that does not exist for it.
      # Upgrading such a checkout means either setting POSTGRES_* in `.env` to the
      # names the volume already has, or discarding the volume with
      # `docker compose down -v`. That is stated here because the failure it
      # produces (`role "tempox" does not exist`) reads like a code defect.
      POSTGRES_USER: ${POSTGRES_USER:-tempox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tempox}
      POSTGRES_DB: ${POSTGRES_DB:-tempox}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tempox}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The `tempox` defaults are what a clone with no `.env` gets.
      DATABASE_URL: postgres://${POSTGRES_USER:-tempox}:${POSTGRES_PASSWORD:-tempox}@postgres:5432/${POSTGRES_DB:-tempox}
      BACKEND_PORT: 3001
      RUST_LOG: ${RUST_LOG:-info}
      # The shop's calendar zone. `/api/day` answers from this, never from the
      # browser's clock: a rebuilt PC defaults to UTC, and the shop's day must
      # not move because of it.
      SHOP_TIMEZONE: ${SHOP_TIMEZONE:-America/Argentina/Buenos_Aires}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The proxy in the app reads this per request, so the image carries no
      # deployment inside it. `backend` is the service name on this network; from
      # the host, `http://localhost:3001` is the same process.
      BACKEND_URL: http://backend:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
