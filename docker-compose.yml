# The development stack.
#
# Two pieces, and only two: the database and a way to look inside it. The backend
# runs with `cargo run` on the host and the frontend with `npm run dev`, which is
# what makes the edit loop fast — neither pays for an image build to see a change.
#
# The deliverable stack is `docker-compose.prod.yml`, and it is a different file
# on purpose: that one runs real images, publishes only the frontend, and has no
# adminer. Making one file do both would mean every command choosing an
# environment, and a forgotten variable launching the wrong one.
#
# Usage:  docker compose up -d          (from the repository root)
#         cd backend && cargo run
#         cd frontend && npm run dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # These defaults are for a NEW volume. Docker only applies POSTGRES_* when
      # it initializes the volume, so a volume created by an older checkout keeps
      # whatever role it was born with, and these values silently do nothing.
      #
      # They used to say `skilluv`, from the template this repository started as.
      # Changing them is not free: an existing volume has no `tempox` role, so the
      # backend's composed URL would reach a database that does not exist for it.
      # Upgrading such a checkout means either setting POSTGRES_* in `.env` to the
      # names the volume already has, or discarding the volume with
      # `docker compose down -v`. That is stated here because the failure it
      # produces (`role "tempox" does not exist`) reads like a code defect.
      POSTGRES_USER: ${POSTGRES_USER:-tempox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tempox}
      POSTGRES_DB: ${POSTGRES_DB:-tempox}
    ports:
      # Published because `cargo run` on the host connects through it. The
      # production file does not publish this: nothing there needs a host view.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tempox}"]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  # `_dev` on purpose. The production file declares `pgdata_prod`, so starting
  # that stack on a developer machine cannot write into this ledger — which is
  # append-only by trigger, and therefore cannot be undone row by row.
  pgdata_dev:
