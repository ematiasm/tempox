<!doctype html>
<!-- es-AR is the default language (S2); `+layout.svelte` keeps this attribute
     in step when the toggle changes it. It is written here too so the very
     first byte -- before any JavaScript runs -- is already in the shop's
     language. -->
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <!-- The body carries no Tailwind colour utilities. `app.css` owns the ground
       and the ink, and a utility class here would be a second, invisible
       authority over both: `bg-slate-950` survived v1a's dark theme long after
       the paper world replaced it, and it painted the page before the
       stylesheet loaded. One owner, or the two drift. -->
  <body data-sveltekit-preload-data="hover" class="min-h-screen">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
