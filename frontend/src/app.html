<!doctype html>
<!-- es-AR is the default language (S2); `+layout.svelte` keeps this attribute
     in step when the toggle changes it. It is written here too so the very
     first byte -- before any JavaScript runs -- is already in the shop's
     language. -->
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-slate-950 text-slate-100 min-h-screen">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
